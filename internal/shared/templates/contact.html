<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nuevo mensaje de contacto — Zelko</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            @page {
                size: A4;
                margin: 18mm 16mm;
            }

            html,
            body {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                color: #333;
                line-height: 1.6;
                font-size: 14px;
            }

            body {
                background-color: #525659;
                padding: 40px 20px;
            }

            .document-page {
                background-color: #ffffff;
                max-width: 800px;
                margin: 0 auto;
                padding: 60px 50px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                border-radius: 2px;
            }

            .header {
                border-bottom: 2px solid #15803d;
                padding-bottom: 15px;
                margin-bottom: 40px;
            }

            .header h1 {
                font-size: 24px;
                color: #15803d;
                text-transform: uppercase;
                letter-spacing: 1px;
                margin: 0;
            }

            .header .company-name {
                font-size: 12px;
                color: #15803d;
                text-transform: uppercase;
                letter-spacing: 2px;
                margin-bottom: 6px;
                font-weight: 600;
            }

            .info-section {
                display: table;
                width: 100%;
                margin-bottom: 40px;
            }

            .info-row {
                display: table-row;
            }

            .info-label {
                display: table-cell;
                font-weight: bold;
                color: #555;
                padding: 12px 20px 12px 0;
                border-bottom: 1px solid #eee;
                width: 30%;
                text-transform: uppercase;
                font-size: 12px;
                letter-spacing: 0.5px;
                vertical-align: top;
            }

            .info-value {
                display: table-cell;
                padding: 12px 0;
                border-bottom: 1px solid #eee;
                color: #222;
                font-size: 15px;
                vertical-align: top;
            }

            .info-value a {
                color: #16a34a;
                text-decoration: none;
            }

            .message-section {
                margin-top: 20px;
            }

            .message-title {
                font-weight: bold;
                color: #1a1a1a;
                text-transform: uppercase;
                font-size: 14px;
                margin-bottom: 15px;
            }

            .message-content {
                background-color: #fafafa;
                border: 1px solid #e0e0e0;
                padding: 30px;
                font-size: 15px;
                white-space: pre-wrap;
                word-break: break-word;
                min-height: 200px;
            }

            .footer {
                margin-top: 60px;
                padding-top: 20px;
                border-top: 1px dashed #ccc;
                text-align: center;
                color: #7f8c8d;
                font-size: 12px;
            }

            .no-break {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            .page-break {
                break-before: page;
                page-break-before: always;
            }

            @media print {
                body {
                    background: #fff;
                    padding: 0;
                }

                .document-page {
                    max-width: none;
                    width: 100%;
                    margin: 0;
                    padding: 0;
                    box-shadow: none;
                    border-radius: 0;
                }

                .header,
                .info-section,
                .message-section,
                .footer {
                    break-inside: avoid;
                    page-break-inside: avoid;
                }

                a {
                    color: inherit;
                    text-decoration: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="document-page">
            <div class="header no-break">
                <div class="company-name">Zelko</div>
                <h1>Nuevo Mensaje de Contacto</h1>
            </div>

            <div class="info-section no-break">
                <div class="info-row">
                    <div class="info-label">Nombre del Remitente:</div>
                    <div class="info-value">{{ .Name }}</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Correo Electrónico:</div>
                    <div class="info-value">
                        <a href="mailto:{{ .Email }}">{{ .Email }}</a>
                    </div>
                </div>
            </div>

            <div class="message-section">
                <div class="message-title no-break">Contenido del Mensaje</div>
                <div class="message-content">{{ .Message }}</div>
            </div>

            <div class="footer no-break">
                <p>Documento generado automáticamente desde Zelko.</p>
            </div>
        </div>
    </body>
</html>
